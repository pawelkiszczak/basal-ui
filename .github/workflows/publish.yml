name: publish
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: The release commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "release tags must point to a commit on main"
            exit 1
          }
      - name: Validate the version and classify the release
        id: version
        run: |
          uv run --no-project --python 3.13 --with 'packaging>=23' python - <<'PY'
          import os
          import tomllib
          from packaging.version import Version

          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match pyproject version {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"prerelease={str(Version(version).is_prerelease).lower()}", file=output)
          PY
      - name: Validate release notes before publishing
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '$0=="# "v{p=1;next} /^# /{p=0} p' docs/WHATS_NEW.md > notes.md
          [ -s notes.md ] && grep -q '[^[:space:]]' notes.md || { echo "docs/WHATS_NEW.md has no '# $tag' section"; exit 1; }
      - run: uv build
      - name: The wheel carries the page and the examples, and installs
        run: |
          unzip -l dist/*.whl | grep -q 'basal_ui/static/vendor/'
          unzip -l dist/*.whl | grep -q 'basal_ui/examples/media/'
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import importlib.resources as r; assert (r.files('basal_ui')/'static/index.html').is_file()"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: notes.md

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  release:
    # The GitHub release uses the matching changelog section and the built files.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build, publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes
      - env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          # The notes were validated by build, before the publish job could start.
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md "${flags[@]}" dist/*
